[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# SPEC-0016: the `kreivo` crate links these virto-sdk crates, and smoldot under
# the development-only `fork` feature. The source here stays Apache-2.0; a
# binary built with them is distributed under GPL-3.0-or-later.
exceptions = [
  { allow = ["GPL-3.0-or-later"], crate = "sube" },
  { allow = ["GPL-3.0-or-later"], crate = "pass" },
  { allow = ["GPL-3.0-or-later"], crate = "scale-serialization" },
  { allow = ["GPL-3.0-or-later"], crate = "sube-fork" },
  { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "smoldot" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/transact-rs/sqlx",
  "https://github.com/virto-network/virto-sdk",
]
required-git-spec = "branch"
