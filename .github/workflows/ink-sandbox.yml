name: ink! v5 compatibility

on:
  pull_request:
    paths:
      - 'tools/ink-sandbox/**'
      - 'crates/provider-execution/**'
      - 'crates/generated-contracts/**'
      - 'crates/domain-primitives/**'
      - 'services/mock-provider/**'
      - 'Cargo.toml'
      - 'scripts/verify.sh'
      - '.github/workflows/ink-sandbox.yml'
  push:
    branches: [master]
    paths:
      - 'tools/ink-sandbox/**'
      - 'crates/provider-execution/**'
      - 'crates/generated-contracts/**'
      - 'crates/domain-primitives/**'
      - 'services/mock-provider/**'
      - 'Cargo.toml'
      - 'scripts/verify.sh'
      - '.github/workflows/ink-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Install the reviewed dependency-policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Enforce the exact-lock SDK dependency policy
        run: bash scripts/verify.sh ink-sandbox-dependencies
      - name: Verify pinned WASM against the native runtime
        run: bash scripts/verify.sh ink-sandbox
