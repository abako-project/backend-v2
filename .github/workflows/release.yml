# Publishes backend images to GHCR when a version tag on master is pushed.
# Actions are pinned to full commit SHAs; the trailing comment names the release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Matches infra/backend.Dockerfile so tests and images use the same compiler.
  # rust-toolchain.toml says `stable`; this variable overrides it.
  RUSTUP_TOOLCHAIN: 1.96.1
  IMAGE_PREFIX: ghcr.io/abako-project/kunveno-

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: kunveno
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kunveno_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kunveno"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_ADAPTER_DATABASE_URL: postgres://kunveno:ci-only@localhost:5432/kunveno_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Tag filters cannot express "tags on master", so check reachability here.
      - name: Require the tagged commit to be on master
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::${GITHUB_REF_NAME} does not point to a commit on master"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo test --workspace --doc --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The three targets share one build stage. Building them in sequence on
      # one builder compiles the workspace once.
      #
      # Moving tags (X.Y, X, latest) let `podman auto-update` follow a release
      # line. The autoupdate label is inherited by containers created from the
      # image, so a Quadlet unit needs no AutoUpdate= line to opt in.
      - id: meta-adapter-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}adapter-api
          # Prereleases get only their exact version. A 0.x major is not a
          # compatible release line, so the bare major tag starts at v1.
          tags: &semver-tags |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: &labels |
            io.containers.autoupdate=registry
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/backend.Dockerfile
          target: adapter-api
          push: true
          tags: ${{ steps.meta-adapter-api.outputs.tags }}
          labels: ${{ steps.meta-adapter-api.outputs.labels }}
          annotations: ${{ steps.meta-adapter-api.outputs.annotations }}

      - id: meta-wallet
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}wallet
          tags: *semver-tags
          labels: *labels
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/backend.Dockerfile
          target: wallet
          push: true
          tags: ${{ steps.meta-wallet.outputs.tags }}
          labels: ${{ steps.meta-wallet.outputs.labels }}
          annotations: ${{ steps.meta-wallet.outputs.annotations }}

      - id: meta-mock-provider
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}mock-provider
          tags: *semver-tags
          labels: *labels
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/backend.Dockerfile
          target: mock-provider
          push: true
          tags: ${{ steps.meta-mock-provider.outputs.tags }}
          labels: ${{ steps.meta-mock-provider.outputs.labels }}
          annotations: ${{ steps.meta-mock-provider.outputs.annotations }}
