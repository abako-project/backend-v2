name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      require-master:
        description: Require the checked-out commit to belong to master
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on master
        if: ${{ inputs.require-master }}
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          for pg_bindir in /usr/lib/postgresql/*/bin; do
            if [[ -x "$pg_bindir/initdb" ]]; then
              echo "$pg_bindir" >> "$GITHUB_PATH"
            fi
          done
      - name: Verify application and both mock backends
        run: bash scripts/verify.sh app
