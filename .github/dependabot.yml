version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      application:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /services/contract-provider
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      provider:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
