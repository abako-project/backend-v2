[package]
name = "chain-provider"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The in-process fork of Kreivo. Never part of a live image.
fork = ["kreivo/fork"]

[dependencies]
protocol.workspace = true
kreivo.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
rand = { workspace = true, features = ["std_rng"] }
parity-scale-codec.workspace = true
tracing.workspace = true
zeroize.workspace = true
sha2.workspace = true
serde_cbor_2.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { workspace = true }
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["softpasskey"] }
webauthn-rs-proto = "=0.6.2"
url.workspace = true

# Ported from the embedded provider, which did not follow the workspace lints.
[lints.rust]
unsafe_code = "forbid"
