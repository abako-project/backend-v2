[package]
name = "kreivo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["live"]
# A Kreivo node over WebSocket with TLS.
live = ["sube/wss"]
# An in-process fork of Kreivo and its development operations. Never part of
# a live image.
fork = ["sube/fork"]

[dependencies]
protocol.workspace = true
sube.workspace = true
pass.workspace = true
smol.workspace = true
blake2.workspace = true
libwallet.workspace = true
parity-scale-codec.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
