# Test-only adapter substitute for infra/verify.py; never mounted by Compose.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 32; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        location = /api/probe {
            return 200 '$request_method|$uri|$arg_probe|$http_origin|$http_x_csrf_token|$http_cookie';
        }
        location = /api/events {
            default_type text/event-stream;
            return 200 'id: $http_last_event_id\nevent: probe\ndata: ok\n\n';
        }
        location / { return 418; }
    }
}
