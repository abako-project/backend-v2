worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream adapter {
        zone adapter 64k;
        server adapter-api:8080 resolve;
    }
    upstream frontend {
        zone frontend 64k;
        server frontend:8080 resolve;
    }
    server {
        listen 8080;
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        location = /api { return 308 /api/; }
        location ~ ^/(?:api/)?(?:internal|health|ready)(?:/|$) { return 404; }
        location /api/ {
            proxy_pass http://adapter;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_cache off;
        }
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
