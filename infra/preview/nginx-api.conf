# Insert only into the selected existing HTTPS server block.
# The existing exact /api/kreivo-rpc location keeps precedence.
location = /api {
    return 308 /api/;
}

location ~ ^/api/(?:internal|health|ready)(?:/|$) {
    return 404;
}

location /api/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:4080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 1h;
    proxy_buffering off;
    proxy_cache off;
    access_log /var/log/nginx/digesta-api-access.log digesta_api;
}
