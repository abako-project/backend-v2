[workspace]
resolver = "3"
members = [
  "crates/bloque-rs",
  "crates/protocol",
  "crates/kreivo",
  "services/wallet",
  "services/api",
  "apps/example-web",
]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
repository = "https://github.com/abako-project/backend-v2"

[workspace.dependencies]
bloque = { version = "0.1.0", path = "crates/bloque-rs" }
protocol = { version = "0.1.0", path = "crates/protocol" }
kreivo = { version = "0.1.0", path = "crates/kreivo" }
# GPL-3.0-or-later, see docs/security/supply-chain.md. The revision is on virto-sdk's main.
sube = { version = "1.0.0", git = "https://github.com/virto-network/virto-sdk", rev = "fd465f43bd9ebb605831fda63a53c28e8804206f", default-features = false, features = ["std"] }
pass = { version = "0.1.0", git = "https://github.com/virto-network/virto-sdk", rev = "fd465f43bd9ebb605831fda63a53c28e8804206f", default-features = false, features = ["std"] }
libwallet = { version = "0.4.0", git = "https://github.com/virto-network/virto-sdk", rev = "fd465f43bd9ebb605831fda63a53c28e8804206f", default-features = false, features = ["sr25519", "rand"] }
smol = "2.0.2"
blake2 = { version = "0.10.6", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
sqlx = { version = "=0.9.0", git = "https://github.com/transact-rs/sqlx", branch = "main", default-features = false, features = ["runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query"] }
tokio-stream = { version = "0.1.18", features = ["sync", "time"] }
uuid = { version = "1.24.1", default-features = false, features = ["std", "serde"] }
getrandom = "0.4.3"
rand = "0.10.3"
subxt-signer = { version = "0.51.1", default-features = false, features = ["sr25519", "std"] }
parity-scale-codec = { version = "3.7.5", features = ["derive"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }
argon2 = { version = "0.5.3", default-features = false, features = ["std", "zeroize"] }
sha2 = "0.11.1"
time = { version = "0.3.55", default-features = false, features = ["parsing", "large-dates"] }
leptos = { version = "0.8.19", default-features = false, features = ["csr"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
